spring.application.name=flowpay

spring.datasource.url=jdbc:postgresql://localhost:5432/flowpay_db
spring.datasource.username=flowpay_user
spring.datasource.password=${FLOWPAY_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}